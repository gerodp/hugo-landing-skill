{{ define "main" }}
<section class="py-20 md:py-28 bg-white">
  <div class="max-w-3xl mx-auto px-4 sm:px-6">
    <!-- Taxonomy Header -->
    <header class="text-center mb-12 md:mb-16">
      <span class="section-kicker">Blog</span>
      <h1 class="section-title mt-4">{{ .Title }}</h1>
      {{ with .Content }}
      <div class="mt-6 text-lg text-slate-600 leading-relaxed">
        {{ . }}
      </div>
      {{ end }}
    </header>

    <!-- Terms cloud -->
    {{ if .Pages }}
    <div class="flex flex-wrap justify-center gap-3">
      {{ range .Pages.ByTitle }}
      <a href="{{ .RelPermalink }}"
         class="rounded-full bg-slate-100 px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-primary-50 hover:text-primary-700 transition-colors">
        {{ .LinkTitle }}
        <span class="text-slate-400">({{ len .Pages }})</span>
      </a>
      {{ end }}
    </div>
    {{ else }}
    <p class="text-center text-slate-500">{{ i18n "noPosts" | default "No articles here yet." }}</p>
    {{ end }}
  </div>
</section>
{{ end }}
